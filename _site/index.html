<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PaperNotes：以繁體中文整理研究論文的背景、方法、實驗與閱讀筆記。">
  <title>PaperNotes｜論文閱讀知識庫</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">Paper<span>Notes</span><span class="brand-dot" aria-hidden="true">.</span></a><span class="header-note">研究，從理解開始</span></div></header>
  <main id="main" class="container">
    <section class="hero" aria-labelledby="page-title"><p class="eyebrow">THE READING COLLECTION / 論文閱讀知識庫</p><h1 id="page-title">把論文讀懂，<br>把想法留下。</h1><p class="intro">從研究動機到核心方法，從實驗證據到閱讀反思。<br class="desktop-break">用有脈絡的繁體中文筆記，累積可以回頭查閱的研究理解。</p><a class="text-link" href="#collection">探索論文收藏 <span aria-hidden="true">↓</span></a></section>
    <section id="collection" class="collection" aria-labelledby="collection-title"><div class="section-heading"><div><p class="eyebrow">LIBRARY</p><h2 id="collection-title">論文收藏</h2></div><p id="total" class="muted">正在載入收藏…</p></div>
      <form class="filters" role="search"><div class="search-field"><label for="search">關鍵字搜尋</label><input id="search" type="search" placeholder="搜尋標題、作者、標籤或筆記…" autocomplete="off"></div><div><label for="category">研究分類</label><select id="category"><option value="">所有分類</option><option value="Image Processing">影像處理</option><option value="Networking">網路通訊</option><option value="AI & ML">人工智慧與機器學習</option><option value="Other">其他</option></select></div><button id="reset" type="reset">重設</button></form>
      <p id="results-status" class="result-status" role="status" aria-live="polite">正在載入論文…</p><div id="papers" class="paper-grid" aria-label="論文列表"></div>
      <noscript><p class="notice">請啟用 JavaScript 以載入論文、搜尋與篩選。</p></noscript>
    </section>
    <aside class="reading-note"><span class="note-mark" aria-hidden="true">※</span><div><h2>以來源為依據，以問題延伸閱讀。</h2><p>筆記是理解的起點。草稿會明確標示待查證資訊；引用與實作前，請回到原始論文核對。</p></div></aside>
  </main>
  <footer class="container site-footer"><a class="brand" href="index.html">PaperNotes.</a><p>持續閱讀・謹慎求證・留下思考</p><a href="README.md">專案與新增指南 ↗</a></footer>
</body>
</html>
